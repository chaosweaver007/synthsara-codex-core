name: Sonic Codex Registry Validation

on:
  push:
    paths:
      - "sonic/**"
      - "tests/validate_registry.py"
      - "requirements-dev.txt"
      - ".github/workflows/sonic-codex-validate.yml"
  pull_request:
    paths:
      - "sonic/**"
      - "tests/validate_registry.py"
      - "requirements-dev.txt"
      - ".github/workflows/sonic-codex-validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Sonic Codex registry
        run: python tests/validate_registry.py
